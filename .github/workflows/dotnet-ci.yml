
name: .NET WebAPI CI

on:
  push:
branches:
  - main
  - dev
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WebAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WebAPI.slnx

      - name: Build WebAPI
        run: dotnet build WebAPI.slnx --configuration Release --no-restore
